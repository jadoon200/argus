name: CI

# Frugal by design (private-repo Actions minutes are finite; public repos run free):
# ubuntu-only, single Python, narrow triggers, and in-progress runs are cancelled.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install pinned runtime + dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock          # reproducible, pinned runtime
          pip install ruff mypy pytest pytest-cov respx
          # The `optimize` extra (DSPy) is heavy and only test_optimize needs it; that
          # test importorskips, so we keep CI lean and let it skip here.

      - name: Ruff lint
        run: ruff check src tests

      - name: Ruff format
        run: ruff format --check src tests

      - name: Mypy (strict)
        run: mypy src/argus

      - name: Pytest
        run: pytest -q
