name: Lock

# Regenerate requirements.lock on Linux — the platform CI and Docker actually run on, so
# the pins resolve to the right wheels (a macOS-frozen lock is only a bootstrap). Manual:
# run it from the Actions tab (or `gh workflow run lock.yml`) after changing requirements.txt.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Freeze pinned runtime deps
        run: |
          python -m pip install --upgrade pip
          printf -- '--extra-index-url https://download.pytorch.org/whl/cpu\n\n' > requirements.lock
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
          pip freeze --exclude-editable >> requirements.lock

      - name: Commit if the lock changed
        run: |
          if git diff --quiet -- requirements.lock; then
            echo "requirements.lock already up to date on Linux."
            exit 0
          fi
          git config user.name "@jaydenOoOo"
          git config user.email "jaydenmaliyil@icloud.com"
          git add requirements.lock
          git commit -m "Regenerate requirements.lock on Linux"
          git push

      - uses: actions/upload-artifact@v4
        with:
          name: requirements-lock
          path: requirements.lock
