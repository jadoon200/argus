# Render blueprint — one free web service for the whole app (API + dashboard).
# Deploy: push to GitHub, then New → Blueprint on https://render.com and point it here.
# The free plan spins the service down after ~15 min idle and cold-starts on the next hit
# (~30-60s); fine for a public demo. Render injects $PORT and provides TLS + the URL.
services:
  - type: web
    name: argus
    runtime: docker
    dockerfilePath: ./Dockerfile.web
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Free + key-free by design (also baked into the image; set here for visibility).
      # OPTIONAL live model at $0: Groq's free developer tier (no card) speaks the OpenAI
      # API. To enable, change this to "openai" and set in the Render dashboard:
      #   ARGUS_OPENAI_BASE_URL=https://api.groq.com/openai/v1
      #   ARGUS_OPENAI_MODEL=llama-3.3-70b-versatile
      #   ARGUS_OPENAI_API_KEY=<free key from console.groq.com>   (keep it a secret env var)
      #   ARGUS_BRIEF_MODE=quick   (panel mode exceeds the free 12K tokens/min budget)
      # See docs/DEPLOY.md "Live model on the free cloud deploy". Key absent/throttled →
      # briefs degrade to the deterministic digest, never an error.
      - key: ARGUS_LLM_BACKEND
        value: template
      # Answer from the baked demo corpus rather than fetching + embedding on demand
      # (the slim image ships no embedding model).
      - key: ARGUS_AUTO_COLLECT
        value: "false"
      # Render terminates TLS and sets X-Forwarded-For, so rate-limit per real client IP.
      - key: ARGUS_API_TRUST_FORWARDED_HEADER
        value: "true"
