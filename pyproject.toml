[project]
name = "argus"
version = "0.1.0"
description = "ARGUS — all-source intelligence analyst workbench: OSINT collection, source-rated fusion, and a cited-brief analyst agent"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "prefect>=3.0",
    "structlog>=24.1",
    "tenacity>=8.3",
    "defusedxml>=0.7",
    "sentence-transformers>=3.0",
    "rank-bm25>=0.2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# Best-quality LLM backend (optional; the deterministic template backend needs nothing).
anthropic = ["anthropic>=0.40"]
# Named-entity recognition backend (optional; extract.py degrades to a heuristic without it).
nlp = ["spacy>=3.7"]
# Apple-silicon local LLM backend (optional, darwin-only).
mlx = ["mlx-lm>=0.19; sys_platform == 'darwin'"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/argus"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true

# Third-party libraries without type stubs — scoped, do not widen.
[[tool.mypy.overrides]]
module = [
    "rank_bm25.*",
    "sentence_transformers.*",
    "sklearn.*",
    "spacy.*",
    "mlx_lm.*",
    "prefect.*",
    "defusedxml.*",
    "langgraph.*",
    "anthropic.*",
]
ignore_missing_imports = true

# Prefect's @flow/@task decorators are untyped under strict; scope the exception
# to the flow module only — do not widen it.
[[tool.mypy.overrides]]
module = ["argus.ingest.flows"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
